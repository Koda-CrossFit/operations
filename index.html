<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Operations">
<title>Koda Operations</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Print media means it never holds up the first paint: on a bad connection the page still opens at once, in the system font. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme: light;
  --ink:#0C1A2B;
  --text:#27323F;
  --muted:#5F6B7A;
  --koda:#16324F;
  --koda-slate:#536779;
  --tint:#EEF3F8;
  --line:#E5E9EF;
  --soft:#F7F9FB;
  --danger:#B42318;
  --radius:14px;

  --edge:#C9D1DB;          /* the outline of something you can tap or type in */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --gutter:16px;
  --bar:56px;
  --stick:calc(var(--bar) + var(--safe-t));   /* where sticky things stop under the header */
  --floor:calc(var(--bar) + var(--safe-b));   /* and above the tab bar */
}
@media (min-width:360px){:root{--gutter:20px}}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{
  margin:0;background:#fff;color:var(--text);
  font:400 16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-wrap:anywhere;
}
@media (max-width:899.98px){body.locked{overflow:hidden}}
h1,h2,h3,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{
  background:none;border:0;padding:0;cursor:pointer;text-align:inherit;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
button:disabled{cursor:default}
svg{display:block;flex:none}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus{outline:none}
:focus-visible{outline:2px solid var(--koda);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ----- type ----- */
.title{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.h2{font-size:19px;line-height:1.3;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.h3{font-size:17px;line-height:1.3;font-weight:600;color:var(--ink)}
.lead{font-size:16px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.strong{font-weight:600;color:var(--ink)}
.nowrap{white-space:nowrap}
.err{color:var(--danger);font-size:15px;font-weight:500}
.danger{color:var(--danger)}

/* ----- buttons ----- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:56px;padding:12px 20px;border-radius:var(--radius);
  font-size:17px;font-weight:600;line-height:1.25;text-align:center;
  transition:background-color .15s,border-color .15s,color .15s;
}
.btn-primary{background:var(--koda);color:#fff}
.btn-primary:active{background:#0F2439}
.btn-primary:disabled{background:#7E8FA1}
.btn-soft{background:var(--tint);color:var(--koda)}
.btn-soft:active{background:#E1E9F1}
.btn-line{background:#fff;color:var(--ink);border:1px solid var(--edge)}
.btn-line:active{background:var(--soft)}
.btn-line:disabled{color:var(--muted);border-color:var(--line);background:var(--soft)}
.btn-sm{width:auto;min-height:44px;padding:8px 16px;font-size:15px;border-radius:12px}
.link{
  display:inline-flex;align-items:center;min-height:44px;border-radius:8px;color:var(--koda);font-size:15px;font-weight:500;
  text-decoration:underline;text-decoration-color:#B9C6D3;text-underline-offset:3px;
}
.link-center{display:flex;width:100%;justify-content:center}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--koda-slate)}
.icon-btn:active{background:var(--soft)}

/* ----- shell ----- */
.top{
  position:sticky;top:0;z-index:20;height:var(--stick);padding-top:var(--safe-t);
  padding-left:calc(var(--gutter) + var(--safe-l));padding-right:calc(var(--gutter) - 6px + var(--safe-r));
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.brand svg{height:15px;width:auto;fill:var(--ink)}
.avatar{
  display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;
  background:var(--tint);color:var(--koda);font-weight:600;font-size:16px;line-height:1;
}
.avatar-sm{width:32px;height:32px;font-size:14px}
.top-me{display:grid;place-items:center;width:44px;height:44px;border-radius:50%}
.main{
  padding:20px calc(var(--gutter) + var(--safe-r)) calc(var(--bar) + var(--safe-b) + 40px) calc(var(--gutter) + var(--safe-l));
}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--bar) + var(--safe-b));padding-bottom:var(--safe-b);
  padding-left:var(--safe-l);padding-right:var(--safe-r);
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  background:#fff;border-top:1px solid var(--line);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;height:var(--bar);
  font-size:13px;line-height:16px;font-weight:500;color:var(--muted);
}
.tab[aria-current=page]{color:var(--koda);font-weight:600}
.tab[aria-current=page] .i{stroke-width:2.1}
.tab .tiny{display:none}
.side{display:none}

@media (max-width:359.98px){
  .tabbar-5 .tab .swap{display:none}
  .tabbar-5 .tab .tiny{display:inline}
}

/* A tablet gets one comfortable column too, except for the managers' wide tables. */
@media (min-width:600px) and (max-width:899.98px){
  .main{max-width:calc(640px + 2 * var(--gutter));margin:0 auto}
  .wide .main{max-width:none}
}

@media (min-width:900px){
  html{scrollbar-gutter:stable}
  :root{--stick:0px;--floor:0px;--gutter:32px}
  .top,.tabbar{display:none}
  .side{
    position:fixed;left:0;top:0;bottom:0;width:220px;z-index:20;
    display:flex;flex-direction:column;padding:22px 12px 14px;
    background:#fff;border-right:1px solid var(--line);
  }
  .side .brand{padding:0 10px 22px}
  .side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .side-link{
    display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 10px;border-radius:10px;
    font-weight:500;color:var(--muted);
  }
  .side-link:hover{background:var(--soft)}
  .side-link[aria-current=page]{background:var(--tint);color:var(--koda);font-weight:600}
  .side-me{
    display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 10px;border-radius:10px;
    font-weight:500;color:var(--ink);border-top:0;
  }
  .side-me:hover{background:var(--soft)}
  .col{margin-left:220px}
  .main{max-width:calc(640px + 64px);margin:0 auto;padding:36px 32px 64px}
  .wide .main{max-width:calc(1100px + 64px)}
}

/* ----- blocks ----- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(12,26,43,.05)}
.sec{margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.count{font-size:15px;color:var(--muted);white-space:nowrap}
.hello{margin-bottom:16px}
.hello-date{font-size:15px;color:var(--muted);margin-bottom:2px}
.empty{padding:36px 20px;text-align:center}
.empty .h3{margin-bottom:4px}
.badge{
  display:grid;place-items:center;width:56px;height:56px;margin:0 auto 14px;border-radius:50%;
  background:var(--tint);color:var(--koda);
}
.chip{
  display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:999px;
  background:var(--tint);color:var(--koda);font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;
}
.chip-quiet{background:var(--soft);color:var(--muted);font-weight:500}
.chip-danger{background:#FEF3F2;color:var(--danger)}
.chip-wrap{white-space:normal;min-width:0;border-radius:12px}
.quiet-note{margin-bottom:14px;padding:10px 14px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:15px}

/* ----- clock card ----- */
.clock{padding:20px}
.clock-label{font-size:14px;color:var(--muted)}
.clock-shift{font-size:19px;line-height:1.3;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:14px}
.clock-state{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--ink)}
.clock-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--koda)}
.clock-time{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:4px 0 2px}
.clock-sub{font-size:15px;color:var(--muted);margin-bottom:14px}
.clock-note{font-size:15px;color:var(--muted);margin-bottom:12px}
.clock .link{margin-top:6px}
.clock-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clock-row .btn{flex:none}
.clock-row-text{min-width:0}
.clock-linked{padding-bottom:8px}
.clock-small{padding:12px 12px 12px 16px}
.clock-small .link{margin:2px 0 -8px}

/* ----- stale clock-out ----- */
.stale{padding:20px;margin-bottom:12px;border-color:#F1C7C2}
.stale-tag{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;font-weight:600;color:var(--danger)}
.stale-tag i{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.stale form{margin-top:14px}

/* ----- tasks ----- */
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;border-radius:2px;background:var(--koda);transition:width .25s ease}
.tasks{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(12,26,43,.05)}
.task{display:grid;grid-template-columns:56px minmax(0,1fr)}
.task+.task{border-top:1px solid var(--line)}
.check{
  display:flex;align-items:flex-start;justify-content:center;width:56px;min-height:100%;padding-top:17px;
  border-radius:var(--radius) 0 0 var(--radius);
}
.check:focus-visible{outline-offset:-3px}
.circle{
  display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  border:2px solid var(--koda-slate);background:#fff;   /* the one control this whole site is for, so it can't be faint */
  transition:background-color .12s,border-color .12s,transform .12s;
}
@media (hover:hover){.check:hover .circle{border-color:var(--koda)}}
.check:active .circle{transform:scale(.9)}
.circle svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s}
.check[aria-checked=true] .circle{background:var(--koda);border-color:var(--koda)}
.check[aria-checked=true] .circle svg{opacity:1;transform:none}
.task-main{display:block;width:100%;min-width:0;padding:16px 16px 16px 0;text-align:left;border-radius:0 var(--radius) var(--radius) 0}
.task-main:focus-visible{outline-offset:-3px}
.task-title{display:block;font-size:17px;line-height:1.3;font-weight:600;color:var(--ink);transition:color .15s}
.task-details{display:block;margin-top:3px;font-size:16px;line-height:1.4;color:var(--muted)}
.task-meta{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;padding-right:26px;font-size:14px;line-height:1.4;color:var(--muted)}
.task-note{display:flex;gap:6px;margin-top:8px;font-size:15px;line-height:1.4;color:var(--text);white-space:pre-wrap}
.task-note-mark{position:absolute;right:0;bottom:1px;color:#8D99A6}
.task-note-mark svg{width:18px;height:18px}
.task-note svg{width:16px;height:16px;margin-top:3px;color:var(--koda-slate)}
.task.done .task-title{color:var(--muted)}
.task.done .task-details{opacity:.85}
.note-edit{grid-column:1/-1;padding:0 16px 16px 56px;scroll-margin:calc(var(--stick) + 12px) 0 calc(var(--floor) + 84px)}
.note-edit .input{min-height:84px;font-size:16px}
.row-btns{display:flex;gap:8px;margin-top:10px}
.row-btns .btn{flex:1;padding-left:10px;padding-right:10px;white-space:nowrap}

/* ----- all done / open tasks ----- */
.alldone{margin-top:12px;padding:24px 20px;text-align:center;scroll-margin-bottom:calc(var(--floor) + 16px)}
.alldone .btn{margin-top:14px}
.open-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:12px 16px;font-weight:500;color:var(--ink)}
.open-toggle .i{color:var(--koda-slate);transition:transform .15s}
.open-toggle[aria-expanded=true] .i{transform:rotate(90deg)}
#open-tasks{scroll-margin:calc(var(--stick) + 12px) 0 calc(var(--floor) + 16px)}
.open-hint{padding:0 16px 12px;font-size:15px;color:var(--muted)}
.open-list{border-top:1px solid var(--line)}
.open-row{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.open-row+.open-row{border-top:1px solid var(--line)}
.open-row-text{min-width:0}
.open-row .btn{width:100%;min-height:48px}
@media (min-width:520px){
  .open-row{flex-direction:row;align-items:center;gap:12px}
  .open-row-text{flex:1}
  .open-row .btn{flex:none;width:auto;min-height:44px}
}

/* ----- segmented control ----- */
.seg{display:flex;padding:3px;border-radius:12px;background:var(--tint)}
.seg button{
  flex:1;min-height:44px;min-width:0;padding:6px 8px;border-radius:9px;text-align:center;
  font-size:15px;font-weight:500;color:var(--muted);transition:background-color .12s,color .12s;
}
.seg button[aria-pressed=true]{background:#fff;color:var(--koda);font-weight:600;box-shadow:0 1px 2px rgba(12,26,43,.05)}

/* ----- schedule ----- */
.days{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.day-head{display:flex;align-items:center;gap:14px;width:100%;padding:14px 14px 14px 14px;text-align:left;border-radius:var(--radius)}
.day-tile{
  flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:52px;border-radius:12px;
  background:var(--tint);color:var(--koda);line-height:1.1;
}
.day-tile b{font-size:19px;font-weight:700}
.day-tile span{font-size:13px;font-weight:500}
.day-info{flex:1;min-width:0}
.day-name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:17px;line-height:1.3;font-weight:600;color:var(--ink)}
.day-sub{display:flex;flex-wrap:wrap;gap:0 12px;font-size:15px;line-height:1.4;color:var(--muted)}
.day-head .i{flex:none;color:var(--koda-slate);transition:transform .15s}
.day-head[aria-expanded=true] .i{transform:rotate(90deg)}
.day .tasks{border:0;border-top:1px solid var(--line);box-shadow:none;border-radius:0 0 var(--radius) var(--radius)}
.day-off{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:2px 14px;font-size:15px;color:var(--muted)}
.day-off>:first-child{flex:none}

/* ----- availability ----- */
.wk-scroll{
  display:flex;gap:8px;margin:14px calc(-1 * var(--gutter)) 16px;padding:2px var(--gutter);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-padding:0 var(--gutter);
}
.wk-scroll::-webkit-scrollbar{display:none}
.wk-chip{
  flex:none;min-height:60px;min-width:108px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;
  transition:background-color .12s,border-color .12s;
}
.wk-chip b{display:block;font-size:15px;line-height:1.3;font-weight:600;color:var(--ink);white-space:nowrap}
.wk-chip span{display:flex;align-items:center;gap:4px;font-size:14px;line-height:1.4;color:var(--muted);white-space:nowrap}
.wk-chip span svg{width:14px;height:14px;fill:none;stroke:var(--koda);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.wk-chip[aria-pressed=true]{background:var(--tint);border-color:var(--koda)}
.wk-chip .is-danger{color:var(--danger);font-weight:500}
.btn-pair{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn-pair .btn{flex:1 1 auto;width:auto;min-height:52px;font-size:15px;padding:10px 12px;white-space:nowrap}
@media (max-width:479.98px){.due{display:block}}
.status-line{margin-top:10px;font-size:15px;color:var(--muted)}
.stepper-card{margin-top:16px;padding:16px 20px 18px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.step{
  display:grid;place-items:center;flex:none;width:60px;height:60px;border-radius:50%;background:var(--tint);color:var(--koda);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background-color .12s;
}
.step:active{background:#DDE6EF}
.step:disabled{color:#A9B5C2;background:var(--soft)}
.step .i{stroke-width:2.2}
.step-val{flex:1;min-width:0;text-align:center}
.step-input{
  width:100%;max-width:120px;min-height:44px;padding:0;border:0;background:none;text-align:center;
  font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;color:var(--ink);
}
.step-input:focus-visible{outline-offset:4px;border-radius:8px}
.step-input::placeholder{color:#A9B5C2;opacity:1}
.step-unit{display:block;font-size:14px;color:var(--muted)}
.grid-wrap{margin-top:8px}
.grid{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:#fff}
.grid th,.grid td{padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;font-weight:inherit}
.grid thead th{position:sticky;top:var(--stick);z-index:5;border-top:1px solid var(--line);background:#fff}
.grid tr>:first-child{width:42px;border-left:1px solid var(--line)}
@media (min-width:360px){.grid tr>:first-child{width:50px}}
.grid thead th:first-child{border-top-left-radius:12px}
.grid thead th:last-child{border-top-right-radius:12px}
.grid tbody tr:last-child th{border-bottom-left-radius:12px}
.grid tbody tr:last-child td:last-child{border-bottom-right-radius:12px}
.g-day,.g-hour,.g-cell{display:block;width:100%;text-align:center;touch-action:manipulation}
.g-day{padding:7px 0 6px;line-height:1.15;color:var(--ink);border-radius:8px}
.g-day b{display:block;font-size:13px;font-weight:600}
.g-day span{display:block;font-size:15px;font-weight:600;color:var(--muted)}
.g-hour{height:38px;font-size:13px;line-height:1.1;font-weight:500;color:var(--muted);white-space:nowrap}
.g-hour .ap{display:block;font-size:13px}
.g-cell{height:38px;background:#fff;transition:background-color .08s}
.g-cell[aria-pressed=true]{background:var(--koda)}
.g-cell:focus-visible,.g-hour:focus-visible,.g-day:focus-visible{outline-offset:-2px}
.g-cell[aria-pressed=true]:focus-visible{outline-color:#fff}
.grid td.off,.grid td.off .g-cell{background:var(--soft)}
.grid th.off .g-day b,.grid th.off .g-day span{color:#9AA5B1}
.grid tbody tr:last-child td:last-child .g-cell{border-bottom-right-radius:11px}
@media (hover:hover){
  .g-cell:not(:disabled):hover{background:var(--tint)}
  .g-cell[aria-pressed=true]:not(:disabled):hover{background:#1F4366}
}
.grid-foot{
  position:sticky;bottom:var(--floor);z-index:4;background:#fff;

.mtask-title{font-size:16px;line-height:1.35;font-weight:600;color:var(--ink)}
.mtask.done .mtask-title{color:var(--muted)}
.mtask-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:14px;line-height:1.4;color:var(--muted)}

.mtask .btn{flex:none;width:auto;min-height:44px;padding:6px 12px;font-size:14px;border-radius:10px;border-color:var(--line);color:var(--koda)}
.empty-line{padding:0 16px 14px;font-size:15px;color:var(--muted)}
.people-card{padding:16px}
.person-line{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.person-line:first-of-type{margin-top:8px}
.person-line:last-child{padding-bottom:0}
.rank{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--koda);font-size:14px;font-weight:600}
.person-body{flex:1;min-width:0}
.person-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.person-name{font-weight:600;color:var(--ink)}
.person-meta{font-size:14px;line-height:1.45;color:var(--muted)}
.person-note{margin-top:3px;font-size:14px;line-height:1.4;color:var(--text)}
.side-card{padding:16px}
.side-card .h3{margin-bottom:2px}
.side-card .btn{margin-top:12px;width:100%}
.mgr-two{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1180px){.mgr-two{grid-template-columns:440px minmax(0,1fr);align-items:start}}
.oo-form{padding:20px}
.oo-form .h2{margin-bottom:14px}
.group{margin-top:16px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{
  min-width:48px;min-height:48px;padding:6px 14px;border-radius:12px;border:1px solid var(--edge);background:#fff;text-align:center;
  font-size:15px;font-weight:500;color:var(--ink);transition:background-color .12s,border-color .12s;
}
.pick-big{flex:1;font-size:17px;font-weight:600;min-height:52px}
.pick-week{flex:1;min-height:60px;line-height:1.3}
.pick small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.pick[aria-pressed=true] small{color:var(--koda)}
.pick[aria-pressed=true]{background:var(--tint);border-color:var(--koda);color:var(--koda);font-weight:600}
.pick:disabled{color:#A0ABB7;background:var(--soft);border-color:var(--line)}
.oo-list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.oo-row{padding:14px 16px}
.oo-row+.oo-row{border-top:1px solid var(--line)}
.oo-title{font-size:17px;line-height:1.3;font-weight:600;color:var(--ink)}
.oo-row.is-done .oo-title{color:var(--muted)}
.oo-details{margin-top:2px;font-size:15px;line-height:1.4;color:var(--muted)}
.oo-status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:14px;line-height:1.4;color:var(--muted)}
.oo-btns{display:flex;gap:8px;margin-top:10px}
.oo-btns .btn{min-height:44px;padding:6px 14px;font-size:14px;border-color:var(--line);color:var(--koda)}
/* Keeps the button in reach however far down the form the person is. */
.dock{
  position:sticky;bottom:var(--floor);z-index:3;margin:16px -20px -20px;padding:12px 20px;
  background:#fff;border-top:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);
}
.dock .form-err{margin:0 0 10px}
.sheet:has(.dock){padding-bottom:0}
.sheet .dock{bottom:0;margin:16px -20px 0;padding-bottom:calc(16px + var(--safe-b));border-radius:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tools .input{flex:1 1 180px;width:auto;max-width:280px}
.tools .btn{flex:0 0 auto;min-height:52px}
@media (max-width:359.98px){
  .tools .input{flex-basis:100%;max-width:none}
  .tools .btn{flex:1 1 100%}
}
.issues{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:#FEF3F2;color:var(--danger);font-size:15px;font-weight:500}
.hp{border-top:1px solid var(--line)}
.hp:first-child{border-top:0}
.hp-head{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px 10px 16px;text-align:left}
.hp-head:focus-visible{outline-offset:-3px;border-radius:12px}
.hp-who{flex:1;min-width:0}
.hp-name{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-weight:600;color:var(--ink)}
.hp-sub{font-size:14px;color:var(--muted)}

.sheet-wrap{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;

}
.sheet{
  width:100%;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;

@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

  position:fixed;left:0;right:0;bottom:calc(var(--bar) + var(--safe-b) + 12px);z-index:40;

.pill{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px;font-weight:500;box-shadow:0 1px 2px rgba(12,26,43,.05)}
.nudge{
  display:flex;align-items:center;gap:8px;width:100%;max-width:440px;padding:8px 6px 8px 16px;border-radius:14px;
  background:var(--tint);border:1px solid #D5DFE9;
}
.nudge-text{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--koda)}
.nudge .btn{flex:none;width:auto;min-height:44px;padding:6px 14px;font-size:15px;border-radius:12px}

/* ----- desktop, after the rules it changes ----- */
@media (min-width:600px){
  .wk-scroll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:14px 0 16px;padding:0;overflow:visible}
  .wk-chip{min-width:0}
}
@media (min-width:900px){
  .wk-switch{justify-content:center}
  .wk-switch .h2{flex:0 1 180px}
}

/* ----- a mouse gets a little feedback too ----- */
@media (hover:hover){
  .btn-primary:not(:disabled):not(:active):hover{background:#1D3F63}
  .btn-soft:not(:active):hover{background:#E6EDF4}
  .btn-line:not(:disabled):not(:active):hover,.wk-arrow:not(:disabled):hover,.icon-btn:hover{background:var(--soft)}
  .pick:not(:disabled):not([aria-pressed=true]):hover,.wk-chip:not([aria-pressed=true]):hover{background:var(--soft)}
  .person:hover,.day-head:hover,.open-toggle:hover,.mgroup-head:hover,.hp-head:hover{background:var(--soft);border-radius:12px}
  .seg button:not([aria-pressed=true]):hover{color:var(--koda)}
}

/* ----- loading ----- */
.skel{border-radius:12px;background:var(--soft)}
.skel-line{height:18px;margin-bottom:10px}
.skel-card{height:88px;margin-bottom:12px;border-radius:var(--radius)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

    reply = await apiRead('boot', { name });
  } catch (err) {
    if (seq === S.bootSeq) {
      S.syncFailed = true;
      syncSoon(RETRY_REFRESH_MS);
      render();

    return;
  }
  if (name !== S.me || seq !== S.bootSeq) return;

    if (reply.retry) {
      S.syncFailed = true;
      syncSoon(RETRY_REFRESH_MS);
      render();

      signOut(reply.error);

    return;

    loadBoot(); // a write landed while this read was out, so it may have missed it
    return;

  if (reply.me.name !== S.me) {
    S.me = reply.me.name;
    store.set('me', S.me);
  }
  const newDay = !!S.boot && S.boot.now.date !== reply.now.date;
  S.boot = reply;
  S.bootAt = Date.now();
  S.syncFailed = false;
  store.set('boot.' + S.me, { data: reply, at: S.bootAt });
  refreshView();
  tidyStore(reply.now.date);
  afterBoot();

  if (newDay) {
    // Everything worked out from the old copy starts over: Monday shows the new week, the 1st the new month.
    S.mgr.weekOf = null;
    S.mgr.month = null;

  }

}

  if (!document.hidden) loadBoot();
  Q.nudgeNow();
}

/* Old copies of weeks and months nobody will look at again, so they can't fill up a phone over the years. */
let storeTidied = false;
function tidyStore(today) {
  if (storeTidied) return;
  storeTidied = true;
  const cutoff = addDays(today, -60);
  store.keys().forEach((key) => {
    const week = /^(?:board|avail\..+|draft\..+)\.(\d{4}-\d{2}-\d{2})$/.exec(key);
    const month = /^mhours\.(\d{4}-\d{2})$/.exec(key);
    if ((week && week[1] < cutoff) || (month && month[1] < cutoff.slice(0, 7))) store.del(key);
  });
}

/* One read of a thing at a time. Asking again while one is out shares its answer, unless
   something just changed (fresh), which sends one more once it's back. */
const reads = {};
function readOnce(key, fresh, work) {
  const running = reads[key];
  if (running) {
    if (fresh) running.again = true;
    return running.done;
  }
  const read = { again: false, done: null };
  reads[key] = read;
  read.done = (async () => {
    try {
      do {
        read.again = false;
        await work();
      } while (read.again);
    } finally {
      delete reads[key];
    }
  })();
  return read.done;
}

/* Availability, one week at a time. */
function availFirstWeek(view) {
  const weeks = view.availability.weeks.filter((week) => week.weekOf !== view.week.thisWeek.weekOf); // a week under way is there if they want it, but it's not where to land
  const first = weeks.find((week) => !week.past || week.status === 'missing');
  return (first || weeks[0]).weekOf;
}
function loadAvailabilityTab() {
  const view = S.view;
  if (!view || view.me.type !== 'Flexible') return;
  if (!S.avail.week || S.avail.week < view.week.thisWeek.weekOf) S.avail.week = availFirstWeek(view);
  loadAvailabilityWeek(S.avail.week);
}
/* Nobody picked this week, they just landed on it. If the deadlines have moved on since (an old
   copy of the page, or a phone left open past Friday morning), land on the right one. */
function followFirstWeek() {
  const view = S.view;
  if (!view || view.me.type !== 'Flexible' || !S.avail.week || S.avail.chosen || S.avail.success) return;
  const first = availFirstWeek(view);
  const current = availForm(S.avail.week);
  if (first === S.avail.week || (current && current.dirty)) return;
  S.avail.week = first;
  loadAvailabilityWeek(first);
}
function availForm(weekOf) {
  return S.avail.forms[weekOf] || null;
}
function draftKey(weekOf) {
  return 'draft.' + S.me + '.' + weekOf;
}
function setAvailForm(weekOf, data) {
  const existing = S.avail.forms[weekOf];
  if (existing && existing.dirty) return;
  const draft = store.get(draftKey(weekOf));
  if (draft && draft.base === data.submittedAt) {
    S.avail.forms[weekOf] = { slots: draft.slots, hoursWanted: draft.hoursWanted, notes: draft.notes, dirty: true, editing: true, message: '', error: '' };
    return;
  }
  if (draft) store.del(draftKey(weekOf)); // saved since, from somewhere else
  S.avail.forms[weekOf] = {
    slots: JSON.parse(JSON.stringify(data.slots || {})),
    hoursWanted: data.none ? null : data.hoursWanted,
    notes: data.notes || '',
    dirty: false,
    editing: existing ? existing.editing : false,
    message: existing ? existing.message : '',
    error: existing ? existing.error : '',
  };
}
function saveDraft(weekOf) {
  const data = S.avail.data[weekOf];
  const current = S.avail.forms[weekOf];
  if (!data || !current) return;
  current.dirty = true;
  store.set(draftKey(weekOf), { slots: current.slots, hoursWanted: current.hoursWanted, notes: current.notes, base: data.submittedAt });
}
async function loadAvailabilityWeek(weekOf) {
  const key = 'avail.' + S.me + '.' + weekOf;
  if (!S.avail.data[weekOf]) {
    const cached = store.get(key);
    if (cached) {
      S.avail.data[weekOf] = cached;
      setAvailForm(weekOf, cached);
      render();
    }
  }
  if (S.avail.loading[weekOf]) return;
  S.avail.loading[weekOf] = true;
  const name = S.me;
  try {
    const reply = await apiRead('availability', { name, weekOf });
    if (name !== S.me) return;
    if (reply.ok === false) {
      if (!S.avail.data[weekOf]) S.avail.error = reply.error;
    } else {
      S.avail.data[weekOf] = reply;
      S.avail.error = '';
      store.set(key, reply);
      setAvailForm(weekOf, reply);
    }
  } catch (err) {
    if (name === S.me && !S.avail.data[weekOf]) S.avail.error = OFFLINE_MESSAGE;
  } finally {
    delete S.avail.loading[weekOf];
  }
  render();
}

/* Manager reads go by POST, so the code never sits in a URL. */
function wrongCode(reply) {
  if (reply && reply.ok === false && /manager code isn't right|manager code hasn't/i.test(reply.error || '')) {
    forgetCode();
    return true;
  }
  return false;
}
function forgetCode() {
  S.code = '';
  store.del('code');
  store.keys().filter((key) => /^(board|mhours)\./.test(key)).forEach((key) => store.del(key));
  S.mgr.boards = {};
  S.mgr.hours = {};
}
function loadBoard(weekOf, fresh) {
  if (!S.code) return Promise.resolve();
  const key = 'board.' + weekOf;
  if (!S.mgr.boards[weekOf]) {
    const cached = store.get(key);
    if (cached) {
      S.mgr.boards[weekOf] = cached;
      render();
    }
  }
  return readOnce(key, fresh, async () => {
    if (!S.code) return;
    try {
      const reply = await apiWrite('mgrBoard', { code: S.code, weekOf });
      if (wrongCode(reply)) {
        S.errors.code = reply.error;
      } else if (reply.ok === false) {
        S.mgr.boardErr = reply.error;
      } else {
        S.mgr.boards[weekOf] = reply;
        S.mgr.boardErr = '';
        store.set(key, reply);
      }
    } catch (err) {
      if (!S.mgr.boards[weekOf]) S.mgr.boardErr = OFFLINE_MESSAGE;
    }
    render();
  });
}
function loadMgrHours(month, fresh) {
  if (!S.code) return Promise.resolve();
  const key = 'mhours.' + month;
  if (!S.mgr.hours[month]) {
    const cached = store.get(key);
    if (cached) {
      S.mgr.hours[month] = cached;
      render();
    }
  }
  return readOnce(key, fresh, async () => {
    if (!S.code) return;
    try {
      const reply = await apiWrite('mgrHours', { code: S.code, month });
      if (wrongCode(reply)) {
        S.errors.code = reply.error;
      } else if (reply.ok === false) {
        S.mgr.hoursErr = reply.error;
      } else {
        S.mgr.hours[reply.month] = reply;
        S.mgr.hoursErr = '';
        store.set('mhours.' + reply.month, reply);
      }
    } catch (err) {
      if (!S.mgr.hours[S.mgr.month]) S.mgr.hoursErr = OFFLINE_MESSAGE;
    }
    render();
  });
}
/* Manage starts on the site's first week until that week has come, since nothing ever runs for an earlier one. */
function startWeek(view) {
  return view.week.firstWeek || view.week.thisWeek.weekOf;
}
function oneOffFormState() {
  const view = S.view;
  const state = form('oneoff');
  const start = startWeek(view);
  if (!state.weekOf || state.weekOf < start) {
    const weekend = view.now.day === 'Sat' || view.now.day === 'Sun';
    const wanted = (weekend ? view.week.nextWeek : view.week.thisWeek).weekOf;
    state.weekOf = wanted > start ? wanted : start;
    resetOneOffFields(state);
  }
  return state;
}
function resetOneOffFields(state) {
  state.title = '';
  state.details = '';
  state.priority = 'B';
  state.minutes = 30;
  state.day = '';
  state.who = [];
}
function loadManage() {
  const view = S.view;
  if (!view || !view.me.manager || !S.code) return;
  if (!S.mgr.weekOf) S.mgr.weekOf = startWeek(view);
  if (!S.mgr.month) S.mgr.month = view.now.date.slice(0, 7);
  if (S.mgr.sub === 'week') loadBoard(S.mgr.weekOf);
  if (S.mgr.sub === 'oneoffs') loadBoard(oneOffFormState().weekOf);
  if (S.mgr.sub === 'hours') loadMgrHours(S.mgr.month);
}

/* ---- the clock card ---- */

function elapsedText(entry, view) {
  if (entry.t) return minutesText(Math.max(0, Math.floor((Date.now() - entry.t) / 60000))); // still waiting to send, so the tap's own time
  const start = labelToMinutes(entry.in);
  const now = serverMinutes();
  if (start === null || now === null) return '';
  const pastMidnight = entry.date < view.now.date ? 1440 : 0;
  return minutesText(Math.max(0, Math.floor(now + pastMidnight - start)));
}
function sinceText(entry, view) {
  return entry.date < view.now.date ? entry.dayLabel + ', ' + entry.in : entry.in;
}
/* Noticing at 5 PM that you finished at noon is the ordinary way to forget, and Clock out would save the wrong hours. */
function viewAlreadyFinished(entry, small) {
  if (String(entry.id).startsWith('waiting-')) return ''; // not at the server yet, so there's nothing to fix
  return html`<button type="button" class="link${small ? '' : ' link-center'}" data-act="fix-hours" data-id="${entry.id}">Already finished? Enter the time</button>`;
}
function todayEntry(view) {
  return view.hours.entries.find((entry) => entry.date === view.now.date && entry.out);
}
function viewClockCard(view, options) {
  const small = options && options.small;
  const noLink = options && options.noLink;
  const shift = view.today.shift;
  const shiftText = shift ? shift.start + ' - ' + shift.end : '';
  if (view.clock.status === 'in' && view.clock.entry) {
    const entry = view.clock.entry;
    const elapsed = elapsedText(entry, view);
    if (small) {
      return html`
        <section class="card clock clock-small" aria-label="Time clock">
          <div class="clock-row">
            <div class="clock-row-text">
              <div class="clock-state"><span class="clock-dot" aria-hidden="true"></span>On the clock</div>
              <div class="muted small">Since ${sinceText(entry, view)}${elapsed ? ', ' + elapsed : ''}</div>
            </div>
            <button type="button" class="btn btn-soft btn-sm" data-act="clock-out">Clock out</button>
          </div>
          ${viewAlreadyFinished(entry, true)}
        </section>`;
    }
    return html`
      <section class="card clock clock-linked" aria-label="Time clock">
        <div class="clock-state"><span class="clock-dot" aria-hidden="true"></span>On the clock since ${sinceText(entry, view)}</div>
        ${elapsed ? html`<div class="clock-time">${elapsed}</div>` : ''}
        <div class="clock-sub">${shiftText ? 'Scheduled ' + shiftText : ''}</div>
        <button type="button" class="btn btn-soft" data-act="clock-out">Clock out</button>
        ${viewAlreadyFinished(entry)}
      </section>`;
  }
  const finished = options && options.newDay ? null : todayEntry(view);
  const finishedText = finished ? 'Clocked out at ' + finished.out + '.' : '';
  if (small) {
    return html`
      <section class="card clock clock-small" aria-label="Time clock">
        <div class="clock-row">
          <div class="clock-row-text">
            <div class="clock-state">${finished ? finishedText : 'Not clocked in'}</div>
          </div>
          <button type="button" class="btn ${finished ? 'btn-soft' : 'btn-primary'} btn-sm" data-act="clock-in">${finished ? 'Clock back in' : 'Clock in'}</button>
        </div>
        <button type="button" class="link" data-act="add-hours">Forgot to clock in?</button>
      </section>`;
  }
  // Once they've clocked out today, going back on the clock isn't the main thing any more.
  return html`
    <section class="card clock${noLink ? '' : ' clock-linked'}" aria-label="Time clock">
      ${shiftText ? html`<div class="clock-label">Scheduled today</div><div class="clock-shift">${shiftText}</div>` : ''}
      ${finished ? html`<p class="clock-note">${finishedText}</p>` : ''}
      <button type="button" class="btn ${finished ? 'btn-soft' : 'btn-primary'}" data-act="clock-in">${finished ? 'Clock back in' : 'Clock in'}</button>
      ${noLink ? '' : html`<button type="button" class="link link-center" data-act="add-hours">Forgot to clock in?</button>`}
    </section>`;
}
function viewStaleCard(view) {
  const entry = view.clock.stale[0];
  if (!entry) return '';
  const state = form('stale');
  const key = 'stale:' + entry.id;

}

function viewToday() {
  const view = S.view;
  if (!view || staleDay()) return viewLoading();
  if (dayIsOver()) {
    // Midnight has passed and the server can't be reached. Yesterday's list isn't today's, so it stays off the screen.
    return html`
      <p class="quiet-note">Can't reach the server right now. Today's list will show up once it's back.</p>
      <div class="hello"><h1 class="title">Hi, ${firstName(view.me.name)}</h1></div>
      ${viewClockCard(view, { small: true, newDay: true })}`;
  }
  const tasks = view.today.tasks;
  const done = tasks.filter((task) => task.done).length;
  const percent = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
  const allDone = tasks.length > 0 && done === tasks.length;
  const finished = todayEntry(view);
  return html`
    ${viewStaleNote()}
    <div class="hello">
      <p class="hello-date">${view.now.label}</p>
      <h1 class="title">Hi, ${firstName(view.me.name)}</h1>
    </div>
    ${viewStaleCard(view)}
    ${viewClockCard(view, { small: !tasks.length })}
    ${tasks.length
      ? html`
        <section class="sec" aria-label="Today's tasks">
          <div class="sec-head">
            <h2 class="h2">Today's tasks</h2>
            <span class="count">${done} of ${tasks.length} done</span>
          </div>
          <div class="prog" role="progressbar" aria-label="Tasks done" aria-valuemin="0" aria-valuemax="${tasks.length}" aria-valuenow="${done}"><i style="width:${percent}%"></i></div>
          <ul class="tasks">${tasks.map(viewTaskRow)}</ul>
          ${allDone
            ? html`
              <div class="card alldone" id="all-done">
                <span class="badge">${I.badgeCheck}</span>
                <p class="h2">All done for today</p>
                ${view.clock.status === 'in'
                  ? html`<button type="button" class="btn btn-primary" data-act="clock-out">Clock out</button>`
                  : finished
                    ? html`<p class="muted" style="margin-top:2px">Clocked out at ${finished.out}.</p>`
                    : html`<button type="button" class="link link-center" data-act="add-hours">Forgot to clock in?</button>`}
              </div>`
            : ''}
        </section>`
      : viewNothingToday(view)}
    ${viewOpenTasks(view)}`;
}

/* ---- schedule ---- */

function viewDay(day, view) {
  const isToday = day.date === view.now.date;
  const parts = day.label.split(', ');
  if (!day.tasks.length) {
    let right = html`<span>Off</span>`;
    if (day.closed) right = html`<span class="chip chip-quiet chip-wrap">Closed: ${day.closed}</span>`;
    else if (day.off) right = html`<span class="chip">Out of town</span>`;
    return html`<li class="day-off" data-key="day:${day.date}"><span>${day.label}${isToday ? ' (today)' : ''}</span>${right}</li>`;
  }
  const open = S.schedOpen[day.date] !== undefined ? S.schedOpen[day.date] : isToday;
  const done = day.tasks.filter((task) => task.done).length;
  const sub = [];
  if (day.shift) sub.push(day.shift.start + ' - ' + day.shift.end);
  sub.push(!done ? plural(day.tasks.length, 'task') : done === day.tasks.length ? 'All ' + done + ' done' : done + ' of ' + day.tasks.length + ' done');
  return html`
    <li class="card day" data-key="day:${day.date}">
      <button type="button" class="day-head" aria-expanded="${open ? 'true' : 'false'}" data-act="day-toggle" data-date="${day.date}">
        <span class="day-tile"><span>${MONTHS[Number(day.date.slice(5, 7)) - 1]}</span><b>${Number(day.date.slice(8))}</b></span>
        <span class="day-info">
          <span class="day-name">${DAY_LONG[parts[0]] || day.label}${isToday ? html`<span class="chip">Today</span>` : ''}${day.off ? html`<span class="chip">Out of town</span>` : ''}</span>
          <span class="day-sub">${sub.map((part) => html`<span>${part}</span>`)}</span>
        </span>
        ${I.chevron}
      </button>
      ${open ? html`<ul class="tasks">${day.tasks.map(viewTaskRow)}</ul>` : ''}
    </li>`;
}
function viewSchedule() {
  const view = S.view;
  if (!view) return viewLoading();
  const which = S.schedWeek;
  const week = view.week[which];
  const anyWork = week.days.some((day) => day.tasks.length);
  let body;
  if (!week.published) {
    body = html`
      <div class="card empty" style="margin-top:16px">
        <span class="badge">${I.schedule}</span>
        <p class="h3">${which === 'nextWeek' ? "Next week's schedule comes out Friday at 7 AM." : "This week's schedule isn't out yet."}</p>
      </div>`;
  } else {
    body = html`
      ${anyWork ? '' : html`<p class="muted" style="margin-top:14px">You're not on the schedule ${which === 'nextWeek' ? 'next week' : 'this week'}.</p>`}
      <ul class="days">${week.days.map((day) => viewDay(day, view))}</ul>`;
  }
  return html`
    ${viewStaleNote()}
    <h1 class="title" style="margin-bottom:14px">Schedule</h1>
    <div class="seg" role="group" aria-label="Which week">
      <button type="button" aria-pressed="${which === 'thisWeek' ? 'true' : 'false'}" data-act="sched-week" data-week="thisWeek">This week</button>
      <button type="button" aria-pressed="${which === 'nextWeek' ? 'true' : 'false'}" data-act="sched-week" data-week="nextWeek">Next week</button>
    </div>
    <p class="muted" style="margin-top:12px">${week.label}</p>
    ${body}`;
}

/* ---- availability ---- */

function chipStatus(week) {
  if (week.status === 'submitted') return html`<span>${I.check}Filled in</span>`;
  if (week.status === 'none') return html`<span>Can't work</span>`;
  if (week.past) return html`<span class="is-danger">Past due</span>`;
  return html`<span>Not yet</span>`;
}
function availWeeks(view) {
  const weeks = view.availability.weeks.slice();
  const wanted = S.avail.week;
  if (wanted && !weeks.some((week) => week.weekOf === wanted)) {
    const data = S.avail.data[wanted];
    weeks.unshift({
      weekOf: wanted,
      label: monthDay(wanted) + ' - ' + (wanted.slice(0, 7) === addDays(wanted, 6).slice(0, 7) ? addDays(wanted, 6).slice(8).replace(/^0/, '') : monthDay(addDays(wanted, 6))),
      deadline: data ? data.deadline : '',
      past: data ? data.past : true,
      status: data && data.submittedAt ? (data.none ? 'none' : 'submitted') : 'missing',
      late: data ? data.late : false,
      hoursWanted: data ? data.hoursWanted : null,
    });
  }
  return weeks;
}
function selectedHours(current, data) {
  let count = 0;
  data.days.forEach((day) => {
    if (dayBlocked(day)) return;
    count += (current.slots[day.key] || []).length;
  });
  return count;
}
function dayBlocked(day) {
  return !!(day.closed || day.off);
}
function viewGrid(current, data) {
  const days = data.days;
  const has = (key, hour) => (current.slots[key] || []).indexOf(hour) >= 0;
  return html`
    <table class="grid" aria-label="Hours you can work">
      <thead>
        <tr>
          <th scope="col"><span class="sr">Hour</span></th>
          ${days.map((day) => html`
            <th scope="col" class="${dayBlocked(day) ? 'off' : ''}">
              <button type="button" class="g-day" data-act="slot-day" data-day="${day.key}" aria-label="${DAY_LONG[day.key]} ${day.label}. Tap for the whole day." ${dayBlocked(day) ? new Safe('disabled') : ''}>
                <b>${day.key}</b><span>${day.label}</span>
              </button>
            </th>`)}
        </tr>
      </thead>
      <tbody>
        ${data.hours.map((hour) => html`
          <tr>
            <th scope="row">
              <button type="button" class="g-hour" data-act="slot-hour" data-hour="${hour}" aria-label="${hourLabel(hour)}. Tap for every day.">${hourLabel(hour)}</button>
            </th>
            ${days.map((day) => {
              const blocked = dayBlocked(day);
              const on = !blocked && has(day.key, hour);
              return html`
                <td class="${blocked ? 'off' : ''}">
                  <button type="button" class="g-cell" aria-pressed="${on ? 'true' : 'false'}" aria-label="${DAY_LONG[day.key]} ${hourLabel(hour)}" data-act="slot" data-day="${day.key}" data-hour="${hour}" ${blocked ? new Safe('disabled') : ''}></button>
                </td>`;
            })}
          </tr>`)}
      </tbody>
    </table>`;
}

function viewAvailability() {
  const view = S.view;
  if (!view) return viewLoading();
  if (view.me.type !== 'Flexible') {
    const days = view.me.setDays || [];
    const line = view.me.type === 'Set'
      ? (days.length ? "You're automatically on the schedule every " + days.join(', ') + '. Nothing to fill out.' : "You're automatically on the schedule. Nothing to fill out.")
      : "Managers aren't on the automatic schedule. Nothing to fill out.";
    return html`
      ${viewStaleNote()}
      <h1 class="title" style="margin-bottom:8px">Availability</h1>
      <p class="lead" style="color:var(--text)">${line}</p>
      <div style="margin-top:-8px">${viewOutOfTown(view, true)}</div>`;
  }
  const weeks = availWeeks(view);
  const success = S.avail.success;
  const weekOf = S.avail.week || availFirstWeek(view);
  const week = weeks.find((one) => one.weekOf === weekOf) || weeks[0];
  const data = S.avail.data[week.weekOf];
  const current = availForm(week.weekOf);
  let body;
  if (success) {
    body = viewAvailSuccess(success);
  } else if (!data || !current) {
    body = S.avail.error
      ? html`
        <div class="card empty">
          <p class="strong">${S.avail.error}</p>
          <button type="button" class="btn btn-line" style="margin-top:14px" data-act="avail-retry">Try again</button>

      : html`<div class="skel skel-card"></div><div class="skel skel-card" style="height:420px"></div>`;
  } else if (data.none && !current.editing) {
    body = viewAvailNone(week);
  } else {
    body = viewAvailForm(view, week, data, current);
  }
  return html`
    ${viewStaleNote()}
    <h1 class="title">Availability</h1>
    ${success ? html`<div style="height:14px"></div>` : html`

        ${weeks.map((one) => html`
          <button type="button" class="wk-chip" data-key="wk:${one.weekOf}" aria-pressed="${one.weekOf === week.weekOf ? 'true' : 'false'}" data-act="avail-week" data-week="${one.weekOf}">
            <b>${one.label}</b>
            ${chipStatus(one)}

    <div data-key="avail:${week.weekOf}:${success ? 'done' : 'form'}">${body}</div>
    ${viewOutOfTown(view, false)}`;
}

/* ---- hours ---- */

function entryLabel(entry) {
  if (entry.flag === 'fixed') return html`<span class="chip chip-quiet">Fixed</span>`;
  if (entry.flag === 'manual') return html`<span class="chip chip-quiet">Added by you</span>`;
  if (entry.flag === 'edited') return html`<span class="chip chip-quiet">Edited by a manager</span>`;
  return '';
}
function viewEntry(entry, view) {
  const running = !!view.clock.entry && view.clock.entry.id === entry.id;
  const isOpenToday = !entry.out && (entry.date === view.now.date || running);
  const missing = !entry.out && !isOpenToday;
  return html`
    <li class="entry" data-key="entry:${entry.id}">
      <div class="entry-text">
        <div class="entry-day">${entry.dayLabel}${entryLabel(entry)}</div>
        <div class="entry-time ${missing ? 'danger' : ''}">
          ${isOpenToday ? entry.in + ' - on the clock now' : missing ? entry.in + ' - no clock-out' : entry.in + ' - ' + entry.out}
        </div>
        ${entry.note ? html`<div class="entry-note">${entry.note}</div>` : ''}
      </div>
      ${missing
        ? html`<button type="button" class="btn btn-soft btn-sm" data-act="fix-hours" data-id="${entry.id}" aria-label="Fix ${entry.dayLabel}">Fix</button>`
        : html`<div class="entry-hours">${entry.hours === null || entry.hours === undefined ? '' : hrs(entry.hours)}</div>`}
    </li>`;
}
function viewHours() {
  const view = S.view;

  const hours = view.hours;

  return html`
    ${viewStaleNote()}

    ${viewClockCard(view, { noLink: true })}
    <div class="total">
      <div class="total-big">
        <span class="total-num">${hoursNumber(hours.monthTotal)}</span>
        <span class="total-word">${hoursWord(hours.monthTotal)} in ${hours.monthLabel}</span>

    <button type="button" class="link" style="margin-top:6px" data-act="add-hours">Forgot to clock in? Add hours.</button>

    ${thisEntries.length
      ? html`

const UNCOVERED_SHOWN = 5;
function assignableDays(board, view) {
  return board.days.filter((day) => day.date >= view.now.date && !day.closed);
}
function options(items, selected) {
  return items.map((item) => html`<option value="${item.value}" ${item.value === selected ? new Safe('selected') : ''}>${item.label}</option>`);
}
function viewUncovered(board, view) {
  const rows = [];
  board.days.forEach((day) => {
    day.uncovered.forEach((task) => {
      if (task.status === 'open') rows.push(Object.assign({ dayLabel: day.label }, task));
    });
  });
  if (!rows.length) return '';
  const days = assignableDays(board, view);
  const people = board.staffNames.map((name) => ({ value: name, label: firstNameOrFull(name, board.staffNames) }));
  // A week nobody filled in can leave dozens of these, and the days and people still need to be findable under them.
  const shown = S.mgr.uncAll ? rows : rows.slice(0, UNCOVERED_SHOWN);
  return html`
    <section class="card unc" aria-label="Uncovered tasks">
      <div class="unc-head">
        <h2 class="h2 danger">Uncovered</h2>
        <span class="chip chip-danger">${rows.length}</span>
      </div>
      ${shown.map((task) => {
        const key = 'assign:' + task.id;
        const state = form(key);
        const dayValue = state.date || (days.some((day) => day.date === task.date) ? task.date : days[0] ? days[0].date : '');
        return html`
          <div class="unc-row" data-key="${key}">
            <div class="unc-title">${task.title}</div>
            <div class="muted small">${task.dayLabel} · About ${minutesText(task.minutes)}${task.top ? ' · Top priority' : ''}</div>
            ${days.length
              ? html`
                <div class="unc-pick">
                  <select class="input" aria-label="Who" data-form="${key}" data-field="name">
                    ${options([{ value: '', label: 'Who?' }].concat(people), state.name || '')}
                  </select>
                  <select class="input" aria-label="Which day" data-form="${key}" data-field="date">
                    ${options(days.map((day) => ({ value: day.date, label: day.label })), dayValue)}
                  </select>
                  <button type="button" class="btn ${rows.length > 1 ? 'btn-soft' : 'btn-primary'} btn-sm" data-act="assign" data-id="${task.id}" ${isBusy(key) ? new Safe('disabled') : ''}>${isBusy(key) ? 'Saving...' : 'Assign'}</button>
                </div>
                ${fieldError(key)}`
              : ''}
          </div>`;
      })}
      ${rows.length > UNCOVERED_SHOWN
        ? html`<button type="button" class="btn btn-line unc-more" data-act="unc-all">${S.mgr.uncAll ? 'Show fewer' : 'Show ' + (rows.length - shown.length) + ' more'}</button>`
        : ''}
    </section>`;
}
function firstNameOrFull(name, everyone) {
  const first = firstName(name);
  return everyone.filter((other) => firstName(other) === first).length > 1 ? name : first;
}
function viewMgrTask(task, day, board, view) {
  const status = task.done ? 'done' : task.status === 'missed' ? 'missed' : 'open';
  const canMove = !task.done && assignableDays(board, view).length > 0;
  return html`
    <li class="mtask${task.done ? ' done' : ''}" data-key="mt:${task.id}">
      <span class="mstat${status === 'done' ? ' is-done' : status === 'missed' ? ' is-missed' : ''}" role="img" aria-label="${status === 'done' ? 'Done' : status === 'missed' ? 'Missed' : 'Not done yet'}">${I.check}</span>
      <div class="mtask-text">
        <div class="mtask-title">${task.title}</div>
        <div class="mtask-meta">
          ${task.done && task.doneAt ? html`<span>Done ${task.doneAt}${task.doneBy ? ' by ' + firstNameOrFull(task.doneBy, board.staffNames) : ''}</span>` : html`<span>About ${minutesText(task.minutes)}</span>`}
          ${status === 'missed' ? html`<span class="danger">Missed</span>` : ''}
          ${task.top && !task.done ? html`<span>Top priority</span>` : ''}
          ${task.source === 'cover' ? html`<span>Covering</span>` : ''}
          ${task.source === 'manual' ? html`<span>Placed by hand</span>` : ''}
          ${task.source === 'late' ? html`<span>Late pickup</span>` : ''}
          ${task.rolled ? html`<span>Carried over</span>` : ''}
        </div>
        ${task.note ? html`<div class="mtask-note">${I.note}<span>${task.note}</span></div>` : ''}
      </div>
      ${canMove ? html`<button type="button" class="btn btn-line" data-act="move" data-id="${task.id}" data-date="${day.date}" aria-label="Move ${task.title}">Move</button>` : ''}
    </li>`;
}
function viewMgrDay(day, board, view) {
  const isToday = day.date === view.now.date;
  const missed = day.uncovered.filter((task) => task.status !== 'open');
  return html`
    <section class="card" data-key="d:${day.date}" aria-label="${day.label}">
      <div class="mday-head">
        <h3 class="h3">${day.label}</h3>
        ${isToday ? html`<span class="chip">Today</span>` : ''}
        ${day.closed ? html`<span class="chip chip-quiet chip-wrap">Closed: ${day.closed}</span>` : ''}
      </div>
      ${day.groups.length || missed.length || day.closed ? '' : html`<p class="empty-line">Nobody on.</p>`}
      ${day.groups.map((group) => {
        const key = day.date + '|' + group.name;
        const open = S.mgr.open[key] !== undefined ? S.mgr.open[key] : isToday;
        const done = group.tasks.filter((task) => task.done).length;
        return html`
          <div class="mgroup" data-key="g:${key}">
            <button type="button" class="mgroup-head" aria-expanded="${open ? 'true' : 'false'}" data-act="mgr-group" data-key2="${key}">
              <span class="avatar avatar-sm">${initial(group.name)}</span>
              <span class="mg-who">
                <span class="mg-name">${firstNameOrFull(group.name, board.staffNames)}</span>
                ${group.shift ? html`<span class="mg-shift"><span class="nowrap">${group.shift.start}</span> - <span class="nowrap">${group.shift.end}</span></span>` : ''}
              </span>
              <span class="mg-count">${done} of ${group.tasks.length}<span class="word"> done</span></span>
              ${I.chevron}
            </button>
            ${open ? html`<ul class="mtasks">${group.tasks.map((task) => viewMgrTask(task, day, board, view))}</ul>` : ''}
          </div>`;
      })}
      ${missed.length ? html`<p class="empty-line" style="padding-top:10px;border-top:1px solid var(--line)">Missed, nobody on it: ${missed.map((task) => task.title).join(', ')}</p>` : ''}
    </section>`;
}
function availText(person, duePassed) {
  if (person.avail === 'set') return html`<span class="chip chip-quiet">Set days</span>`;
  if (person.avail === 'none') return html`<span class="chip chip-quiet">Can't work</span>`;
  if (person.avail === 'missing') return html`<span class="chip ${duePassed ? 'chip-danger' : 'chip-quiet'}">Not in yet</span>`;
  if (person.late) return html`<span class="chip">In late</span>`;
  return html`<span class="chip">Filled in</span>`;
}
function viewPeople(board, view, unbuilt) {
  const line = view.availability.weeks.find((week) => week.weekOf === board.weekOf);
  const duePassed = line ? line.past : true; // the list only has weeks still to come
  return html`
    <section class="card people-card" aria-label="People">
      <h2 class="h2">People</h2>
      ${board.people.map((person) => {
        const assigned = Math.round((person.assignedMin / 60) * 10) / 10;
        const wants = person.wanted === null || person.wanted === undefined ? '' : 'Wants ' + hrs(person.wanted);
        const hoursLine = unbuilt ? wants : wants ? wants + ', has ' + hoursNumber(assigned) : hrs(assigned) + ' assigned';
        const doneLine = person.taskCount ? person.doneCount + ' of ' + plural(person.taskCount, 'task') + ' done' : 'No tasks';
        return html`
          <div class="person-line" data-key="pl:${person.name}">
            <span class="rank" aria-label="Rank ${person.rank === null ? 'none' : person.rank}">${person.rank === null ? initial(person.name) : person.rank}</span>
            <div class="person-body">
              <div class="person-top">
                <span class="person-name">${firstNameOrFull(person.name, board.staffNames)}</span>
                ${availText(person, duePassed)}
              </div>
              ${hoursLine ? html`<div class="person-meta">${hoursLine}</div>` : ''}
              ${unbuilt ? '' : html`<div class="person-meta">${doneLine}, ${hrs(person.loggedHours)} logged</div>`}
              ${person.off.length ? html`<div class="person-meta">Out of town: ${person.off.join(', ')}</div>` : ''}
              ${person.notes ? html`<div class="person-note">${person.notes}</div>` : ''}
            </div>
          </div>`;
      })}
    </section>`;
}
function viewMgrWeek(view) {
  const weekOf = S.mgr.weekOf || startWeek(view);
  const board = S.mgr.boards[weekOf];
  if (!board) {
    return S.mgr.boardErr
      ? html`<div class="card empty"><p class="strong">${S.mgr.boardErr}</p><button type="button" class="btn btn-line" style="margin-top:14px" data-act="mgr-retry">Try again</button></div>`
      : viewLoading();
  }
  const index = board.weeks.findIndex((week) => week.weekOf === board.weekOf);
  const prev = index > 0 ? board.weeks[index - 1] : null;
  const next = index >= 0 && index < board.weeks.length - 1 ? board.weeks[index + 1] : null;
  const over = board.days[6].date < view.now.date;
  const canRebuild = !over && (board.published || addDays(board.weekOf, -3) <= view.now.date);
  const nextWeek = board.nextWeek;
  const nextLine = view.availability.weeks.find((week) => week.weekOf === nextWeek.weekOf);
  const deadlineCard = html`
    <section class="card side-card" aria-label="Availability deadline">
      <h2 class="h3">${nextLine && nextLine.past ? 'Deadline was ' : 'Next deadline: '}${nextWeek.deadline}</h2>
      ${nextLine ? html`<p class="muted" style="font-size:15px">For the week of ${nextLine.label}.</p>` : ''}
      ${nextWeek.missing.length
        ? html`
          <p class="muted" style="font-size:15px">Not in yet: ${nameList(nextWeek.missing)}</p>
          <button type="button" class="btn btn-line" data-act="mgr-remind" data-week="${nextWeek.weekOf}" ${isBusy('remind') ? new Safe('disabled') : ''}>${isBusy('remind') ? 'Sending...' : 'Send reminder now'}</button>`
        : html`<p class="muted" style="font-size:15px">Everyone's in.</p>`}
    </section>`;
  const rerunCard = canRebuild
    ? html`
      <section class="card side-card" aria-label="Re-run matching">
        <h2 class="h3">Re-run matching</h2>
        <p class="muted" style="font-size:15px">Matches later days again. Anything done or placed by hand stays put.</p>
        <button type="button" class="btn btn-line" data-act="mgr-rebuild" data-week="${board.weekOf}">Re-run matching</button>
      </section>`
    : '';
  // Before it's built there's nothing to show day by day. What matters is who's in.
  const unbuilt = !board.published && !board.days.some((day) => day.groups.length || day.uncovered.length);
  return html`
    <div class="wk-switch">
      <button type="button" class="wk-arrow back" data-act="mgr-week" data-week="${prev ? prev.weekOf : ''}" aria-label="Earlier week" ${prev ? '' : new Safe('disabled')}>${I.chevron}</button>
      <h2 class="h2">${board.label}</h2>
      <button type="button" class="wk-arrow" data-act="mgr-week" data-week="${next ? next.weekOf : ''}" aria-label="Later week" ${next ? '' : new Safe('disabled')}>${I.chevron}</button>
    </div>
    <p class="built">${board.published ? 'Went out ' + board.builtAt : 'Not out yet. It goes out Friday at 7 AM.'}</p>
    <p class="on-clock${board.onClock.length ? '' : ' is-none'}">
      <b>On the clock now:</b>
      ${board.onClock.length ? board.onClock.map((one, i) => (i ? ', ' : ' ') + firstNameOrFull(one.name, board.staffNames) + ' since ' + one.since).join('') : ' Nobody'}
    </p>
    ${unbuilt
      ? html`
        <div class="mg-solo">
          ${deadlineCard}
          ${viewPeople(board, view, true)}
          ${rerunCard}
        </div>`
      : html`
        <div class="mg-cols">
          <div class="mg-col">
            ${viewUncovered(board, view)}
            ${board.days.map((day) => viewMgrDay(day, board, view))}
          </div>
          <div class="mg-col">
            ${viewPeople(board, view)}
            ${deadlineCard}
            ${rerunCard}
          </div>
        </div>`}`;
}

/* one-offs */

const PRIORITIES = ['A', 'B', 'C'];
const DURATIONS = [{ value: 15, label: '15 min' }, { value: 30, label: '30 min' }, { value: 60, label: '1 hr' }, { value: 120, label: '2 hrs' }, { value: 240, label: 'Half day' }];

function viewOneOffFields(formName, state, view, staffNames) {
  const weeks = [{ id: 'thisWeek', label: 'This week' }, { id: 'nextWeek', label: 'Next week' }].filter((week) => view.week[week.id].weekOf >= startWeek(view));
  const chosenWeek = weeks.find((week) => view.week[week.id].weekOf === state.weekOf);
  const days = chosenWeek ? view.week[chosenWeek.id].days : [];
  const durations = DURATIONS.some((one) => one.value === Number(state.minutes))
    ? DURATIONS
    : DURATIONS.concat([{ value: Number(state.minutes), label: minutesText(state.minutes) }]);
  const who = state.who || [];
  const pick = (field, value, label, on, extra) => html`
    <button type="button" class="pick ${extra || ''}" aria-pressed="${on ? 'true' : 'false'}" data-act="oo-pick" data-form-name="${formName}" data-field="${field}" data-value="${value}">${label}</button>`;
  return html`
    <label class="field">
      <span class="label">What needs done?</span>
      <input class="input" type="text" maxlength="120" enterkeyhint="go" id="${formName}-title" data-form="${formName}" data-field="title" value="${state.title || ''}" placeholder="Clean the bike fans">
    </label>
    ${fieldError(formName + 'Title')}
    ${formName === 'oneoff' && S.mgr.added ? html`<p class="form-ok" role="status">${S.mgr.added}</p>` : ''}
    <label class="field">
      <span class="label">Details <span class="opt">(optional)</span></span>
      ${formName === 'oneoffEdit'
        ? html`<textarea class="input" rows="3" maxlength="500" data-form="${formName}" data-field="details">${state.details || ''}</textarea>`
        : html`<input class="input" type="text" maxlength="500" enterkeyhint="go" data-form="${formName}" data-field="details" value="${state.details || ''}">`}
    </label>
    <div class="group" role="group" aria-label="Priority">
      <div class="label">Priority</div>
      <div class="picks">${PRIORITIES.map((priority) => pick('priority', priority, priority, String(state.priority).charAt(0) === priority, 'pick-big'))}</div>
    </div>
    <div class="group" role="group" aria-label="About how long">
      <div class="label">About how long?</div>
      <div class="picks">${durations.map((one) => pick('minutes', one.value, one.label, Number(state.minutes) === one.value))}</div>
    </div>
    <div class="group" role="group" aria-label="Which week">
      <div class="label">Which week?</div>
      ${weeks.length ? '' : html`<p class="muted">Week of ${monthDay(state.weekOf)}</p>`}
      <div class="picks">${weeks.map((week) => pick('weekOf', view.week[week.id].weekOf, html`${week.label}<small>${view.week[week.id].label}</small>`, state.weekOf === view.week[week.id].weekOf, 'pick-week'))}</div>
    </div>
    <div class="group" role="group" aria-label="Which day">
      <div class="label">Which day?</div>
      <div class="picks">
        ${pick('day', '', 'Any day', !state.day)}
        ${days.map((day) => {
          const key = day.label.slice(0, 3);
          const gone = day.date < view.now.date || !!day.closed;
          return html`<button type="button" class="pick" aria-pressed="${state.day === key ? 'true' : 'false'}" data-act="oo-pick" data-form-name="${formName}" data-field="day" data-value="${key}" ${gone ? new Safe('disabled') : ''}>${key}</button>`;
        })}
      </div>
    </div>
    <div class="group" role="group" aria-label="Who">
      <div class="label">Who?</div>
      <div class="picks">
        ${pick('who', '', 'Anyone', !who.length)}
        ${staffNames.map((name) => pick('who', name, firstNameOrFull(name, staffNames), who.indexOf(name) >= 0))}
      </div>
    </div>`;
}
function oneOffStatus(item, board) {
  const parts = [];
  if (item.status === 'done') {
    parts.push('Done' + (item.doneBy ? ' by ' + firstName(item.doneBy) : '') + (item.doneAt ? ', ' + item.doneAt : ''));
  } else if (item.assignedTo) {
    parts.push(firstName(item.assignedTo) + ', ' + item.assignedLabel);
  } else if (!board || !board.published) {
    parts.push('Goes out Friday at 7 AM' + (item.day ? ', for ' + DAY_LONG[item.day] : ''));
  }
  return parts.join('');
}
function viewOneOffRow(item, board) {
  const uncovered = item.status === 'open' && !item.assignedTo && board && board.published;
  return html`
    <li class="oo-row${item.status === 'done' ? ' is-done' : ''}" data-key="oo:${item.id}">
      <div class="oo-title">${item.title}</div>
      ${item.details ? html`<div class="oo-details">${item.details}</div>` : ''}
      <div class="oo-status">
        ${item.status === 'done' ? '' : html`<span class="chip">Priority ${item.priority}</span>`}
        <span>
          ${uncovered ? html`<span class="danger">Uncovered${item.assignedLabel ? ', ' + item.assignedLabel : ''}</span>` : oneOffStatus(item, board)}

          ${item.status !== 'done' ? html` · About ${minutesText(item.minutes)}` : ''}
          ${item.status !== 'done' && item.assignedMinutes && item.assignedMinutes < item.minutes ? html` · ${minutesText(item.assignedMinutes)} on the schedule` : ''}
        </span>
      </div>
      <div class="oo-btns">
        ${item.status === 'open' ? html`<button type="button" class="btn btn-line btn-sm" data-act="oo-edit" data-id="${item.id}" aria-label="Edit ${item.title}">Edit</button>` : ''}
        <button type="button" class="btn btn-line btn-sm" data-act="oo-delete" data-id="${item.id}" aria-label="Delete ${item.title}">Delete</button>
      </div>
    </li>`;
}
function viewMgrOneOffs(view) {

/* hours */

function viewMgrHours() {
  const report = S.mgr.hours[S.mgr.month];
  if (!report) {
    return S.mgr.hoursErr
      ? html`<div class="card empty"><p class="strong">${S.mgr.hoursErr}</p><button type="button" class="btn btn-line" style="margin-top:14px" data-act="mgr-retry">Try again</button></div>`
      : viewLoading();
  }
  const longOnes = (person) => person.entries.filter((entry) => entry.long).length;
  const totalLong = report.people.reduce((sum, person) => sum + longOnes(person), 0);
  return html`
    <div>
      <div class="tools">
        <select class="input" aria-label="Month" data-act-change="mgr-month">
          ${options(report.months.map((month) => ({ value: month.month, label: month.label })), report.month)}
        </select>
        <button type="button" class="btn btn-primary btn-sm" data-act="copy-payroll">Copy for payroll</button>
      </div>
      ${report.totalIssues ? html`<p class="issues" role="status">${plural(report.totalIssues, 'entry', 'entries')} still ${report.totalIssues === 1 ? 'needs' : 'need'} a fix.</p>` : ''}
      ${totalLong ? html`<p class="quiet-note" role="status">${plural(totalLong, 'entry', 'entries')} ran much longer than scheduled. Worth a look before payroll.</p>` : ''}
      <div class="card">
        ${report.people.map((person) => {
          const open = !!S.mgr.open['hours|' + person.name];
          return html`
            <div class="hp" data-key="hp:${person.name}">
              <button type="button" class="hp-head" aria-expanded="${open ? 'true' : 'false'}" data-act="mgr-group" data-key2="hours|${person.name}">
                <span class="avatar avatar-sm">${initial(person.name)}</span>
                <span class="hp-who">
                  <span class="hp-name">${firstNameOrFull(person.name, report.people.map((one) => one.name))}${person.issues ? html`<span class="chip chip-danger">${person.issues} to fix</span>` : ''}${longOnes(person) ? html`<span class="chip">${longOnes(person)} long</span>` : ''}</span>
                  <span class="hp-sub">${plural(person.shifts, 'shift')}</span>
                </span>
                <span class="hp-total${Number(person.total) ? '' : ' is-zero'}">${hoursNumber(person.total)} <small>${Number(person.total) === 1 ? 'hr' : 'hrs'}</small></span>
                ${I.chevron}
              </button>
              ${open
                ? html`
                  <div class="hp-entries">
                    ${person.entries.map((entry) => html`
                      <div class="hp-entry" data-key="he:${entry.id}">
                        <div class="entry-text">
                          <div class="entry-day">${entry.dayLabel}${managerFlag(entry)}${entry.overlaps ? html`<span class="chip chip-danger">Overlaps</span>` : ''}${entry.long ? html`<span class="chip">Long</span>` : ''}</div>
                          <div class="entry-time ${!entry.out && entry.flag === 'missing' ? 'danger' : ''}"><span class="nowrap">${entry.in}</span> - <span class="nowrap">${entry.out || 'no clock-out'}${entry.hours === null ? '' : ', ' + hrs(entry.hours)}</span></div>
                          ${entry.note ? html`<div class="entry-note">${entry.note}</div>` : ''}
                        </div>
                        <button type="button" class="btn btn-line" data-act="entry-edit" data-name="${person.name}" data-id="${entry.id}" aria-label="Edit ${entry.dayLabel}">Edit</button>
                      </div>`)}
                    <button type="button" class="btn btn-soft btn-sm hp-add" data-act="entry-add" data-name="${person.name}">Add an entry</button>
                  </div>`
                : ''}
            </div>`;
        })}
      </div>
    </div>`;
}
function managerFlag(entry) {
  if (entry.flag === 'missing') return html`<span class="chip chip-danger">Missing</span>`;
  if (entry.flag === 'fixed') return html`<span class="chip chip-quiet">Fixed</span>`;
  if (entry.flag === 'manual') return html`<span class="chip chip-quiet">Added by them</span>`;
  if (entry.flag === 'edited') return html`<span class="chip chip-quiet">Edited</span>`;
  return '';
}

/* ---- sheets ---- */

function sheetFrame(title, body) {
  return html`
    <div class="sheet-wrap" data-act="sheet-dismiss">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
        <div class="sheet-head">
          <h2 class="h2" id="sheet-title">${title}</h2>
          <button type="button" class="icon-btn" data-act="sheet-close" aria-label="Close">${I.close}</button>

/* ==================================================================== rendering ======== */

function render() {
  const app = $('#app');
  let content;
  if (!S.me) {
    content = viewSignIn();
  } else if (iAmManager() && !S.code && !S.codeSkipped) {
    content = viewCodeStep();
  } else {
    let body;
    if (S.tab === 'schedule') body = viewSchedule();
    else if (S.tab === 'availability') body = viewAvailability();
    else if (S.tab === 'hours') body = viewHours();
    else if (S.tab === 'manage') body = viewManage();
    else body = viewToday();
    content = viewShell(body);
  }
  mount(app, content);
  revealWeekChip();
  renderSheet();
  renderFloat();
}
function revealWeekChip() {
  const chip = $('.wk-chip[aria-pressed="true"]');
  if (!chip || S.avail.revealed === chip.dataset.week) return;
  S.avail.revealed = chip.dataset.week;
  const row = chip.parentElement;
  const rowBox = row.getBoundingClientRect();
  const box = chip.getBoundingClientRect();
  if (box.left < rowBox.left || box.right > rowBox.right) row.scrollLeft += box.left - rowBox.left - parseFloat(getComputedStyle(row).paddingLeft);
}
function renderSheet() {
  const root = $('#sheet');
  mount(root, S.sheet ? SHEETS[S.sheet.type](S.sheet.data || {}) : '');
  document.body.classList.toggle('locked', !!S.sheet);
  const app = $('#app');
  if (S.sheet) app.setAttribute('inert', '');
  else app.removeAttribute('inert');
}
function renderFloat() {
  const status = S.me ? saveStatus() : '';
  mount($('#float'), html`
    ${S.nudge
      ? html`
        <div class="nudge" data-key="nudge">
          <span class="nudge-text">You're not clocked in</span>
          <button type="button" class="btn btn-primary" data-act="clock-in">Clock in</button>
          <button type="button" class="icon-btn" data-act="nudge-close" aria-label="Dismiss">${I.close}</button>
        </div>`
      : ''}
    ${status ? html`<div class="pill" data-key="save">${status}</div>` : ''}
    ${S.toast ? html`<div class="toast" data-key="toast">${S.toast}</div>` : ''}`);
}

let toastTimer = null;
function showToast(message, ms) {

function goToTab(tab) {
