const lastTap = {};
function tooSoon(key, ms) {
  const now = Date.now();
  if (lastTap[key] && now - lastTap[key] < ms) return true;
  lastTap[key] = now;
  return false;
}
function clockIn() {
  if (tooSoon('clock', 800)) return;
  S.nudge = false;
  const date = S.boot ? tapDate(S.boot, Date.now()) : '';
  const today = S.boot ? S.boot.week.thisWeek.days.concat(S.boot.week.nextWeek.days).find((day) => day.date === date) : null;
  Q.add('clockIn', { name: S.me, at: Date.now() }, { label: nowLabel(), dayLabel: today ? today.label : '' });
}
function clockOut() {
  if (tooSoon('clock', 800)) return;
  Q.add('clockOut', { name: S.me, at: Date.now() }, { label: nowLabel() });
}
function maybeNudge(task) {
  const view = S.view;
  if (!view || view.me.manager || view.clock.status === 'in') return;
  if (task.date !== view.now.date) return;
  if (todayEntry(view)) return;
  const key = 'nudge.' + S.me;
  if (store.get(key) === view.now.date) return;
  store.set(key, view.now.date);
  S.nudge = true;
  setTimeout(() => {
    S.nudge = false;
    renderFloat();
  }, 15000);
}
function toggleTask(id) {
  if (tooSoon('task:' + id, 250)) return;
  let target = null;
  eachTask(S.view, id, (task) => { target = target || task; });
  if (!target) return;
  const done = !target.done;
  if (done) maybeNudge(target);
  Q.add('taskToggle', { name: S.me, id, done }, { label: nowLabel() });
  const view = S.view;
  const tasks = view.today.tasks;
  if (done && S.tab === 'today' && tasks.length && tasks.every((task) => task.done)) {
    const card = $('#all-done');
    if (card) card.scrollIntoView({ block: 'nearest', behavior: SCROLL });
  }
}
function changeSlots(change) {
  const weekOf = S.avail.week;
  const current = availForm(weekOf);
  const data = S.avail.data[weekOf];
  if (!current || !data) return;
  change(current, data);
  current.message = '';
  current.error = '';
  saveDraft(weekOf);
  render();
}
function setSlot(slots, key, hour, on) {
  const list = slots[key] || [];
  const at = list.indexOf(hour);
  if (on && at < 0) list.push(hour);
  if (!on && at >= 0) list.splice(at, 1);
  list.sort((a, b) => a - b);
  if (list.length) slots[key] = list;
  else delete slots[key];
}
function stepHours(delta) {
  const weekOf = S.avail.week;
  const current = availForm(weekOf);
  if (!current) return;
  const value = Math.min(40, Math.max(0, (Number(current.hoursWanted) || 0) + delta));
  current.hoursWanted = value;
  delete current.hoursText;
  current.error = '';
  current.hoursError = '';
  saveDraft(weekOf);
  render();
}
function markWeekSaved(weekOf, none, hoursWanted, late) {
  if (!S.boot) return;
  const line = S.boot.availability.weeks.find((week) => week.weekOf === weekOf);
  if (line) {
    line.status = none ? 'none' : 'submitted';
    line.hoursWanted = hoursWanted;
    line.late = late;
  }
  refreshView();
}
async function postAvailability(weekOf, none) {
  const current = availForm(weekOf);
  const data = S.avail.data[weekOf];
  const slots = {};
  if (!none) {
    data.days.forEach((day) => {
      if (!dayBlocked(day) && current.slots[day.key] && current.slots[day.key].length) slots[day.key] = current.slots[day.key];
    });
  }
  const reply = await apiWrite('saveAvailability', { name: S.me, weekOf, slots, hoursWanted: none ? 0 : current.hoursWanted, notes: current.notes || '', none: !!none });
  if (reply.ok === false) return reply;
  store.del(draftKey(weekOf));
  current.dirty = false;
  current.editing = false;
  current.message = '';
  delete S.avail.data[weekOf];
  delete S.avail.forms[weekOf];
  store.del('avail.' + S.me + '.' + weekOf);
  const week = availWeeks(S.view).find((one) => one.weekOf === weekOf);
  markWeekSaved(weekOf, none, none ? 0 : current.hoursWanted, reply.late);
  S.avail.success = { weekOf, label: week ? week.label : '', none: !!none, late: reply.late, past: !!data.past, picked: reply.picked || [] };
  return reply;
}
async function saveAvailability() {
  const weekOf = S.avail.week;
  const current = availForm(weekOf);
  const data = S.avail.data[weekOf];
  if (!current || !data || isBusy('avail')) return;
  commitHoursText(current);
  if (!(Number(current.hoursWanted) > 0)) {
    current.error = '';
    current.hoursError = 'Please tell us how many hours you want this week.';
    render();
    const box = $('#hours-wanted');
    if (box) box.scrollIntoView({ block: 'center', behavior: SCROLL });
    return;
  }
  if (!selectedHours(current, data)) {
    current.error = "Please pick at least one hour, or tap Can't work this week.";
    render();
    return;
  }
  S.busy.avail = true;
  current.error = '';
  render();
  try {
    const reply = await postAvailability(weekOf, false);
    if (reply.ok === false) current.error = reply.error;
    else window.scrollTo(0, 0);
  } catch (err) {
    current.error = OFFLINE_MESSAGE;
  }
  S.busy.avail = false;
  render();
  syncSoon(400);
}
function commitHoursText(current) {
  if (current.hoursText === undefined) return;
  const value = Number(String(current.hoursText).replace(',', '.'));
  if (current.hoursText === '' || !isFinite(value)) current.hoursWanted = current.hoursText === '' ? null : current.hoursWanted;
  else current.hoursWanted = Math.min(40, Math.max(0, Math.round(value * 2) / 2));
  delete current.hoursText;
}

/* One-offs send in order in the background, so the next one can be typed right away. */
let outboxBusy = false;
async function pumpOutbox() {
  if (outboxBusy) return;
  outboxBusy = true;
  try {
    for (;;) {
      const item = S.mgr.outbox.find((one) => !one.error);
      if (!item) break;
      let reply;
      // The answer goes right under the title box: on a phone the keyboard is up by now, and it would hide a toast.
      try {
        reply = await apiWrite('mgrOneOffAdd', Object.assign({ code: S.code, by: S.me }, item.req));
      } catch (err) {
        item.error = OFFLINE_MESSAGE;
        S.mgr.added = '';
        S.errors.oneoffTitle = "Couldn't add " + item.req.title + '. Try again from the list below.';
        render();
        continue;
      }
      if (reply.ok === false) {
        item.error = reply.error;
        S.mgr.added = '';
        S.errors.oneoffTitle = "Couldn't add " + item.req.title + '. Try again from the list below.';
        if (wrongCode(reply)) S.errors.code = reply.error;
        render();
        continue;
      }
      S.mgr.outbox = S.mgr.outbox.filter((one) => one !== item);
      const board = S.mgr.boards[item.req.weekOf];
      if (board && !board.oneOffs.some((one) => one.id === reply.id)) board.oneOffs.push(reply.oneOff);
      if (reply.placed === null) S.mgr.added = 'Added. It goes out Friday at 7 AM.';
      else if (reply.placed.name) S.mgr.added = 'Added. ' + firstName(reply.placed.name) + ' has it on ' + reply.oneOff.assignedLabel + '.';
      else S.mgr.added = 'Added. Nobody fits it yet, so it shows as uncovered.';
      render();
    }
  } finally {
    outboxBusy = false;
  }
  const weekOf = S.view && oneOffFormState().weekOf;
  if (weekOf) loadBoard(weekOf, true);
}

async function sendClockFix(id, time, errorKey, done) {
  if (!time) {
    S.errors[errorKey] = 'Please pick a time.';
    render();
    return;
  }
  S.busy[errorKey] = true;
  S.errors[errorKey] = '';
  render();
  try {
    const reply = await apiWrite('clockFix', { name: S.me, id, out: time });
    S.busy[errorKey] = false;
    if (reply.ok === false && !reply.retry) {
      S.errors[errorKey] = reply.error;
      render();
      return;
    }
    if (reply.ok === false) {
      Q.add('clockFix', { name: S.me, id, out: time });
    } else {
      Q.gen += 1;
      if (S.boot) {
        applyWrite(S.boot, { action: 'clockFix', body: { id, out: time } });
        if (reply.clock) S.boot.clock = reply.clock;
        refreshView();
      }
      syncSoon(300);
    }
    done();
    showToast('Saved.');
  } catch (err) {
    S.busy[errorKey] = false;
    Q.add('clockFix', { name: S.me, id, out: time }); // a repeat with the same time is safe
    done();
    showToast("Saved on this phone. We'll send it when you're back online.");
  }
  render();
}

/* ---------------------------------------------------------------- page events ---- */

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const run = A[el.dataset.act];
  if (run) run(el, event);
});
document.addEventListener('submit', (event) => {
  const el = event.target;
  const run = SUBMITS[el.dataset.submit];
  if (!run) return;
  event.preventDefault();
  run(el);
});
document.addEventListener('input', (event) => {
  const el = event.target;
  if (el.dataset.form) {
    form(el.dataset.form)[el.dataset.field] = el.value;
    const titleError = el.dataset.form + 'Title';
    if (el.dataset.field === 'title' && S.errors[titleError]) {
      S.errors[titleError] = '';
      render();
    }
    if (el.dataset.form === 'off' && el.dataset.field === 'from') {
      const state = form('off');
      if (el.value && (!state.to || state.to < el.value)) state.to = el.value;
      S.errors.offOk = '';
      render();
    }
    return;
  }
  if (el.hasAttribute('data-avail-notes')) {
    const current = availForm(S.avail.week);
    if (current) {
      current.notes = el.value;
      saveDraft(S.avail.week);
    }
    return;
  }
  if (el.hasAttribute('data-avail-hours')) {
    const current = availForm(S.avail.week);
    if (!current) return;
    current.hoursText = el.value;
    const value = Number(el.value.replace(',', '.'));
    current.hoursWanted = el.value === '' || !isFinite(value) ? null : Math.min(40, Math.max(0, value));
    current.error = '';
    current.hoursError = '';
    saveDraft(S.avail.week);
    render();
  }
});
document.addEventListener('change', (event) => {
  const el = event.target;
  if (el.dataset.form) {
    form(el.dataset.form)[el.dataset.field] = el.value; // some time pickers only report on change
    return;
  }
  if (el.hasAttribute('data-avail-hours')) {
    const current = availForm(S.avail.week);
    if (!current) return;
    commitHoursText(current);
    saveDraft(S.avail.week);
    render();
    return;
  }
  if (el.dataset.actChange === 'mgr-month') {
    S.mgr.month = el.value;
    loadMgrHours(el.value);
    render();
  }
});
document.addEventListener('keydown', (event) => {
  if (!S.sheet) return;
  if (event.key === 'Escape') {
    closeSheet();
    return;
  }
  if (event.key === 'Tab') {
    const sheet = $('#sheet .sheet');
    const items = Array.from(sheet.querySelectorAll('button:not([disabled]),input,select,textarea'));
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (event.shiftKey && (document.activeElement === first || document.activeElement === sheet)) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
});

document.addEventListener('touchstart', () => {}, { passive: true }); // an iPhone only shows :active on a button if something listens for touches

let pressedOn = null;
document.addEventListener('pointerdown', (event) => { pressedOn = event.target; }, true);

/* Holding the stepper keeps it going, so 8 hours doesn't take sixteen taps. */
let stepHold = null;
let stepHeld = false;
function stopHold() {
  clearTimeout(stepHold);
  clearInterval(stepHold);
  stepHold = null;
}
document.addEventListener('pointerdown', (event) => {
  const el = event.target.closest('.step');
  if (!el || el.disabled) return;
  stepHeld = false;
  const delta = Number(el.dataset.delta);
  el.addEventListener('pointerleave', stopHold, { once: true });
  stepHold = setTimeout(() => {
    stepHeld = true;
    stepHours(delta);
    stepHold = setInterval(() => stepHours(delta), 110);
  }, 450);
});
['pointerup', 'pointercancel'].forEach((name) => document.addEventListener(name, stopHold));
window.addEventListener('blur', stopHold);
document.addEventListener('contextmenu', (event) => {
  if (event.target.closest('.step')) event.preventDefault();
});

/* Keep things fresh without anyone asking. */
function refreshIfDue(minGap) {
  if (document.hidden || !S.me) return;
  if (Date.now() - lastRefresh < minGap) return;
  loadBoot();
  loadTab();
  Q.nudgeNow();
}
/* A phone waking up redraws first, so a list from yesterday doesn't sit there live until the server answers. */
function wake(minGap) {
  if (!document.hidden) render();
  refreshIfDue(minGap);
}
document.addEventListener('visibilitychange', () => wake(15000));
window.addEventListener('focus', () => wake(15000));
window.addEventListener('pagehide', () => Q.dropLease());
window.addEventListener('pageshow', (event) => {
  if (event.persisted) wake(0);
});
window.addEventListener('popstate', () => {
  if (S.sheet) closeSheet();
});
window.addEventListener('online', () => {
  Q.nudgeNow();
  refreshIfDue(0);
});
setInterval(() => {
  if (!document.hidden) renderFloat();
}, 1000);
setInterval(() => {
  // The five-minute refresh, midnight, and the running time on the clock card.
  if (document.hidden || !S.view) return;
  refreshIfDue(staleDay() ? 20000 : 5 * 60 * 1000);
  if (!S.sheet && S.view.clock.status === 'in') render();
}, 30000);
window.addEventListener('storage', (event) => {
  if (event.key === STORE_PREFIX + 'queue') {
    Q.load();
    refreshView();
    render();
  }
});

/* ========================================================================= start ======= */

function start() {
  const link = new URLSearchParams(location.search);
  const linkName = link.get('me');
  const linkTab = link.get('tab');
  const linkWeek = link.get('week');
  if (location.search || (history.state && history.state.sheet)) history.replaceState(null, '', location.pathname + location.hash);

  // Where this browser tab was only means something if it's still the same person.
  const samePerson = !linkName || linkName === S.me;

  const known = ['today', 'schedule', 'availability', 'hours', 'manage'];
  if (linkTab && known.indexOf(linkTab) >= 0) {
    S.tab = linkTab;
    S.tabChosen = true;
  } else if (linkWeek) {
    S.tab = 'availability';
    S.tabChosen = true;
  } else if (samePerson) {
    const remembered = place.get('tab');
    if (remembered && known.indexOf(remembered) >= 0) {
      S.tab = remembered;
      S.tabChosen = true;
    }
  }
  const week = linkWeek || (samePerson ? place.get('week') : '');
  if (isMonday(week)) {
    S.avail.week = week;
    place.set('week', week);
  }

  if (linkName || S.me) {
    signIn(linkName || S.me, S.avail.week);
  } else {
    render();
    loadNames();
  }
  if (S.me && S.view) afterBoot();
  render();
}
start();
</script>
